<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Bruce Schechter</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; background: var(--bg-alt); }

    .card { background: var(--bg); border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 2.5rem 2rem; width: 100%; max-width: 520px; }
    .card h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }

    .back { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; }
    .back a { color: var(--accent); text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Get in touch</h1>
    <p class="subtitle">Send me a message and I'll get back to you.</p>

    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>

      <label>Quick math check</label>
      <div class="math-row">
        <span class="math-question" id="math-question">Loading…</span>
        <input type="number" id="math-answer" placeholder="?" required />
        <button type="button" class="refresh-btn" id="refresh-math" title="New question">↻</button>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn" style="margin-top:1.75rem;width:100%">Send message</button>
      <div class="form-msg" id="status-msg"></div>
    </form>

    <div class="back"><a href="/">← Back to site</a></div>
  </div>

  <script>
    const API_URL = 'https://s1ucm2bj6i.execute-api.us-west-2.amazonaws.com/prod/contact';
    let mathProblem = {};

    async function loadCaptcha() {
      try {
        const res = await fetch(`${API_URL}/captcha`);
        const data = await res.json();
        mathProblem = { a: data.a, b: data.b, op: data.op };
        document.getElementById('math-question').textContent = data.question;
        document.getElementById('math-answer').value = '';
      } catch {
        const a = Math.floor(Math.random() * 8) + 3;
        const b = Math.floor(Math.random() * 8) + 3;
        const op = Math.random() < 0.5 ? 'add' : 'multiply';
        mathProblem = { a, b, op };
        document.getElementById('math-question').textContent =
          op === 'add' ? `What is ${a} + ${b}?` : `What is ${a} × ${b}?`;
        document.getElementById('math-answer').value = '';
      }
    }

    document.getElementById('refresh-math').addEventListener('click', loadCaptcha);

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn    = document.getElementById('submit-btn');
      const status = document.getElementById('status-msg');
      status.className = 'form-msg';

      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const answer  = document.getElementById('math-answer').value.trim();

      if (!name || !email || !message || !answer) {
        status.className = 'form-msg error';
        status.textContent = 'Please fill in all fields.';
        return;
      }

      btn.disabled = true; btn.textContent = 'Sending…';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, message,
            math_answer: answer, math_a: mathProblem.a, math_b: mathProblem.b, math_op: mathProblem.op }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          status.className = 'form-msg success';
          status.textContent = data.message;
          document.getElementById('contact-form').reset();
          loadCaptcha();
        } else {
          status.className = 'form-msg error';
          status.textContent = data.error || 'Something went wrong. Please try again.';
          if (data.error && data.error.includes('math')) loadCaptcha();
        }
      } catch {
        status.className = 'form-msg error';
        status.textContent = 'Network error — please try again.';
      }

      btn.disabled = false; btn.textContent = 'Send message';
    });

    loadCaptcha();
  </script>
</body>
</html>
