<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Bruce Schechter</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9f9f9;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.35rem;
      margin-top: 1.1rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.15s;
      background: #fafafa;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #5469d4;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 130px; }

    .math-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.35rem;
    }

    .math-question {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }

    .math-row input {
      width: 100px;
      flex-shrink: 0;
    }

    .refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #5469d4;
      font-size: 1.2rem;
      padding: 0.2rem;
      line-height: 1;
    }

    .refresh-btn:hover { color: #3b4fb8; }

    button[type="submit"] {
      margin-top: 1.75rem;
      width: 100%;
      padding: 0.8rem;
      background: #5469d4;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: #3b4fb8; }
    button[type="submit"]:disabled { background: #aab; cursor: not-allowed; }

    .message {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 7px;
      font-size: 0.95rem;
      display: none;
    }

    .message.success { background: #e6f4ea; color: #1e6e34; display: block; }
    .message.error   { background: #fde8e8; color: #b91c1c; display: block; }

    .back { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; }
    .back a { color: #5469d4; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Get in touch</h1>
    <p class="subtitle">Send me a message and I'll get back to you.</p>

    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>

      <label>Quick math check</label>
      <div class="math-row">
        <span class="math-question" id="math-question">Loading…</span>
        <input type="number" id="math-answer" placeholder="?" required />
        <button type="button" class="refresh-btn" id="refresh-math" title="New question">↻</button>
      </div>

      <button type="submit" id="submit-btn">Send message</button>
      <div class="message" id="status-msg"></div>
    </form>

    <div class="back"><a href="/">← Back to site</a></div>
  </div>

  <script>
    // Replace with your deployed API Gateway URL
    const API_URL = 'https://s1ucm2bj6i.execute-api.us-west-2.amazonaws.com/prod/contact';

    let mathProblem = {};

    async function loadCaptcha() {
      try {
        const res = await fetch(`${API_URL}/captcha`);
        const data = await res.json();
        mathProblem = { a: data.a, b: data.b, op: data.op };
        document.getElementById('math-question').textContent = data.question;
        document.getElementById('math-answer').value = '';
      } catch {
        // Fallback: generate client-side
        const a = Math.floor(Math.random() * 8) + 3;
        const b = Math.floor(Math.random() * 8) + 3;
        const op = Math.random() < 0.5 ? 'add' : 'multiply';
        mathProblem = { a, b, op };
        document.getElementById('math-question').textContent =
          op === 'add' ? `What is ${a} + ${b}?` : `What is ${a} × ${b}?`;
        document.getElementById('math-answer').value = '';
      }
    }

    document.getElementById('refresh-math').addEventListener('click', loadCaptcha);

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status-msg');
      status.className = 'message';
      status.textContent = '';

      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const answer  = document.getElementById('math-answer').value.trim();

      if (!name || !email || !message || !answer) {
        status.className = 'message error';
        status.textContent = 'Please fill in all fields.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, email, message,
            math_answer: answer,
            math_a: mathProblem.a,
            math_b: mathProblem.b,
            math_op: mathProblem.op,
          }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          status.className = 'message success';
          status.textContent = data.message;
          document.getElementById('contact-form').reset();
          loadCaptcha();
        } else {
          status.className = 'message error';
          status.textContent = data.error || 'Something went wrong. Please try again.';
          if (data.error && data.error.includes('math')) loadCaptcha();
        }
      } catch {
        status.className = 'message error';
        status.textContent = 'Network error — please try again.';
      }

      btn.disabled = false;
      btn.textContent = 'Send message';
    });

    loadCaptcha();
  </script>
</body>
</html>
