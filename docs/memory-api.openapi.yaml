openapi: 3.0.3

# =============================================================================
# Rapid Recall — Memory Lambda API
#
# Single endpoint backed by the `memory03` AWS Lambda (us-west-2) behind API
# Gateway. The iOS app (../memory) is the canonical client. This spec is hand-
# maintained from lambda_function.py; when you change a request/response shape,
# a status code, or the command vocabulary, update this file AND the API
# Contract table in ../CLAUDE.md in the same commit.
#
# How a request flows: the client POSTs one natural-language utterance in
# `text_from_user`. Unless it is one of the magic literals (RESET_CACHE /
# send_csv), the Lambda runs it through Bedrock LLM classification into one
# command (NEW, UPDATE, REMIND, DELETE, QUIZ, ANSWER, INSTRUCTIONS) and
# dispatches accordingly. A thin conversation state machine (stored per-user in
# S3) can override classification when a multi-turn flow is parked (duplicate
# decision, awaiting quiz answer).
# =============================================================================

info:
  title: Rapid Recall — Memory Lambda API
  version: "1.0.0"
  description: |
    Backend for the Rapid Recall (a.k.a. Memory Sprint) fact-memorization app.
    One POST endpoint accepts a free-text user utterance and returns a friendly
    reply plus the command the backend resolved it to.

    **Authentication.** Every request must carry a Cognito **ID token** as a
    Bearer token in the `Authorization` header. API Gateway's Cognito User Pool
    authorizer validates it and injects the `sub` (used as the per-user
    partition key) and `email` claims; the Lambda never trusts a client-supplied
    username.

    **Status codes.** The Lambda emits exactly `{200, 400, 401, 500, 502,
    503}` — all real HTTP codes. The app-specific `513`/`520` were retired in
    the RFC 9457 error-model pass (Issue #8): an LLM/embedding *call* failure is
    now `503` (transient, retryable, carries `Retry-After`); an LLM
    *bogus-command* response is `502`. The distinct causes that share a status
    are told apart by the problem `type` (see below).

    **Error envelope (RFC 9457).** Every non-2xx response is
    `application/problem+json` with the same shape — a `ProblemDetails` object
    `{type, title, status, detail, instance}` plus the extension members
    `{request_id, reply_to_user, command}`. The stable `type` URI
    (`https://schechter.com/error_codes/<slug>`) is the machine key; mirror it
    against the symbolic registry in `errors.py`. Clients surface
    `reply_to_user` to the user and may branch on `type` or `status`. The
    success path is unchanged: `200` returns `{reply_to_user, command,
    request_id}`.
  contact:
    name: Bruce Schechter
    email: bruce@schechter.com

servers:
  - url: https://fjic2zgsqf.execute-api.us-west-2.amazonaws.com/prod
    description: Production (API Gateway → memory03 Lambda, us-west-2)

tags:
  - name: memory
    description: The single conversational endpoint.

paths:
  /memory:
    post:
      tags: [memory]
      operationId: postMemory
      summary: Submit one user utterance; get a reply and the resolved command.
      description: |
        Send one natural-language message. The backend either:

        * intercepts a **magic literal** before any LLM call —
          `RESET_CACHE` (case-insensitive) clears the user's conversation
          state, and `send_csv` (case-insensitive) emails a CSV of all the
          user's Q&A pairs; or
        * continues a **parked multi-turn flow** if the user's previous turn
          left the conversation awaiting a duplicate decision or a quiz answer;
          or
        * runs the message through **LLM classification** into one command and
          dispatches it.

        The resolved command is echoed back in `command`.
      security:
        - cognitoBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
            examples:
              addFact:
                summary: Add a new fact (classified NEW)
                value:
                  text_from_user: "The capital of France is Paris"
              startQuiz:
                summary: Start a quiz (classified QUIZ)
                value:
                  text_from_user: "quiz me"
              answerQuiz:
                summary: Answer a posed quiz question (routed to ANSWER)
                value:
                  text_from_user: "Gallstone"
              resetCache:
                summary: Magic literal — wipe conversation state
                value:
                  text_from_user: "RESET_CACHE"
              sendCsv:
                summary: Magic literal — email a CSV export of all Q&A pairs
                value:
                  text_from_user: "send_csv"
      responses:
        "200":
          description: |
            Success. `command` names the resolved action.

            **Soft outcomes also return 200.** Anything the backend understood
            and handled — even when it couldn't act — comes back as 200 with a
            helpful `reply_to_user`: quiz answer grading, a weak/again-please
            similarity match on UPDATE/DELETE, an instruction it couldn't parse,
            "no active quiz to answer", and "you have no questions to quiz on
            yet". Only malformed requests (400/401) and genuine system/LLM
            faults (500/502/503) are non-2xx. See docs/spec-conformance.md for
            the status-code taxonomy.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryReply'
              examples:
                newPair:
                  summary: NEW
                  value:
                    reply_to_user: "Added — 'What is the capital of France?' → 'Paris'."
                    command: "NEW"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                quizQuestion:
                  summary: QUIZ (a question is posed; state now AWAITING_QUIZ_ANSWER)
                  value:
                    reply_to_user: "Let's go! Here's your first one: What is the capital of France?"
                    command: "QUIZ"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                graded:
                  summary: ANSWER (graded)
                  value:
                    reply_to_user: "Correct! Paris it is."
                    command: "ANSWER"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                resetOk:
                  summary: RESET_CACHE
                  value:
                    reply_to_user: "Cache has been reset. Starting fresh!"
                    command: "RESET_CACHE"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                csvEmailed:
                  summary: GENERATE_CSV_OF_QA
                  value:
                    reply_to_user: "Done! Your Q&A export has been sent to bruce@schechter.com."
                    command: "GENERATE_CSV_OF_QA"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
        "400":
          description: |
            Bad request (`application/problem+json`). Two `type`s:
            * `missing-params` — `text_from_user` (or the username claim) is
              absent;
            * `no-email-on-account` — `send_csv` requested but the account has
              no email on file (`command` = `GENERATE_CSV_OF_QA`).
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                missingParams:
                  summary: Missing text_from_user
                  value:
                    type: "https://schechter.com/error_codes/missing-params"
                    title: "Required request parameter missing"
                    status: 400
                    detail: "Missing username or text_from_user"
                    instance: "lambda_function.py:lambda_handler:91"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "Your request was missing required information."
                noEmail:
                  summary: send_csv but no email on the account
                  value:
                    type: "https://schechter.com/error_codes/no-email-on-account"
                    title: "No email address on the account"
                    status: 400
                    detail: "No email address on the Cognito profile"
                    instance: "lambda_function.py:lambda_handler:175"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "No email address found for your account."
                    command: "GENERATE_CSV_OF_QA"
        "401":
          description: |
            Unauthorized (`application/problem+json`, `type` = `unauthorized`) —
            the request reached the Lambda without Cognito authorizer claims
            (missing/invalid token). Normally API Gateway rejects these before
            the Lambda runs; this is the defensive fallback.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://schechter.com/error_codes/unauthorized"
                title: "Missing or invalid authentication"
                status: 401
                detail: "Request reached the Lambda without Cognito authorizer claims"
                instance: "lambda_function.py:lambda_handler:64"
                request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                reply_to_user: "You need to sign in again."
        "500":
          description: |
            Internal error (`application/problem+json`) — a genuine system
            fault, not a domain outcome. The `type` names the specific cause:
            `reset-cache-failed`, `csv-generation-failed`, `csv-email-failed`,
            `db-read-failed`, `db-write-failed`, `db-delete-failed`,
            `persist-failed`, `quiz-state-corrupt`, or `internal-unexpected`
            (uncaught fallback). When the fault surfaced inside command
            dispatch, `command` names the command being attempted.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                resetFailed:
                  summary: reset-cache persist failure
                  value:
                    type: "https://schechter.com/error_codes/reset-cache-failed"
                    title: "Reset-cache persistence failed"
                    status: 500
                    detail: "persist_to_s3() returned non-200 clearing the cache"
                    instance: "lambda_function.py:lambda_handler:118"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "Sorry, I couldn't reset your cache. Please try again."
                    command: "RESET_CACHE"
                dbWriteFault:
                  summary: DynamoDB write failure during UPDATE
                  value:
                    type: "https://schechter.com/error_codes/db-write-failed"
                    title: "DynamoDB write failed"
                    status: 500
                    detail: "put_item threw ClientError updating an existing pair"
                    instance: "lambda_function.py:lambda_handler:/ UPDATE branch"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "Sorry, I couldn't save that change. Please try again."
                    command: "UPDATE"
                quizStateCorrupt:
                  summary: stored quiz answer embedding missing/corrupt
                  value:
                    type: "https://schechter.com/error_codes/quiz-state-corrupt"
                    title: "Stored quiz answer embedding missing or corrupt"
                    status: 500
                    detail: "Vectorized answer absent from cached quiz state"
                    instance: "quiz.py:llm_returned_ANSWER:289"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "Something went wrong with that quiz. Please start a new one."
                    command: "ANSWER"
        "502":
          description: |
            Bad gateway (`application/problem+json`, `type` =
            `llm-unknown-command`) — the LLM answered, but with a command
            outside the closed vocabulary (an upstream malfunction, not user
            ambiguity, which is a soft 200). `command` =
            `ERROR_UNKNOWN_COMMAND`. Not retryable.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://schechter.com/error_codes/llm-unknown-command"
                title: "LLM returned an unrecognized command"
                status: 502
                detail: "LLM returned unrecognized command 'FROBNICATE'"
                instance: "lambda_function.py:lambda_handler:/ match default"
                request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                reply_to_user: "Sorry, I couldn't tell what you wanted to do. Please try rephrasing."
                command: "ERROR_UNKNOWN_COMMAND"
        "503":
          description: |
            Service unavailable (`application/problem+json`) — a transient
            upstream (LLM/embedding) fault; **retryable**, so the response
            carries a `Retry-After` header. The `type` names the call that
            failed: `llm-call-failed` (classification), `llm-grade-failed`
            (quiz-answer grading, `command` = `ANSWER`), or `embeddings-failed`.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                classifyFailed:
                  summary: classification call failed
                  value:
                    type: "https://schechter.com/error_codes/llm-call-failed"
                    title: "LLM classification call failed"
                    status: 503
                    detail: "llm_query returned success=False during classification"
                    instance: "lambda_function.py:lambda_handler:/ classify"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "Sorry, I had trouble understanding that just now. Please try again."
                gradingFailed:
                  summary: quiz grading call failed
                  value:
                    type: "https://schechter.com/error_codes/llm-grade-failed"
                    title: "LLM answer-grading call failed"
                    status: 503
                    detail: "llm_query returned success=False during answer grading"
                    instance: "quiz.py:llm_returned_ANSWER:315"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "I encountered an error while evaluating your answer. Please try again."
                    command: "ANSWER"
                embeddingsFailed:
                  summary: embedding generation failed
                  value:
                    type: "https://schechter.com/error_codes/embeddings-failed"
                    title: "Embedding generation call failed"
                    status: 503
                    detail: "get_vector_embeddings threw during UPDATE"
                    instance: "lambda_function.py:lambda_handler:/ UPDATE branch"
                    request_id: "8f1c2e7a-1234-4abc-9def-0123456789ab"
                    reply_to_user: "Sorry, I had trouble processing that just now. Please try again."
                    command: "UPDATE"

    options:
      tags: [memory]
      operationId: optionsMemory
      summary: CORS preflight.
      description: |
        Browsers send this automatically before the cross-origin POST. The
        Lambda short-circuits it with 204 and permissive CORS headers. No auth
        required.
      responses:
        "204":
          description: No content; CORS headers returned.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: "OPTIONS,POST"
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: "*"

components:

  securitySchemes:
    cognitoBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Amazon Cognito **ID token** (User Pool `us-west-2_5CFZClYPo`, app client
        `2ai4o11chs71s82op7sjirh2ih`) passed as `Authorization: Bearer <token>`.
        API Gateway's Cognito authorizer validates it; the Lambda reads the
        `sub` (partition key) and `email` claims from the verified token.

  headers:
    AccessControlAllowOrigin:
      description: CORS — always `*`.
      schema:
        type: string
      example: "*"
    RetryAfter:
      description: |
        Seconds to wait before retrying. Present only on retryable (`503`)
        faults.
      schema:
        type: integer
      example: 5

  schemas:

    MemoryRequest:
      type: object
      required: [text_from_user]
      additionalProperties: false
      properties:
        text_from_user:
          type: string
          minLength: 1
          description: |
            One natural-language utterance, exactly as typed or spoken. May be a
            fact to add, a question, a quiz answer, a command phrase ("quiz me",
            "delete the Hamlet question"), or a magic literal (`RESET_CACHE`,
            `send_csv`). The backend classifies/normalizes it; the client does
            not pre-parse.
          example: "The capital of France is Paris"

    MemoryReply:
      type: object
      required: [reply_to_user, command]
      properties:
        reply_to_user:
          type: string
          description: |
            Friendly, plain-text message to show (and possibly speak via TTS) to
            the user. Never contains markdown.
          example: "Added — 'What is the capital of France?' → 'Paris'."
        command:
          $ref: '#/components/schemas/Command'
        request_id:
          type: string
          nullable: true
          description: |
            The AWS Lambda invocation id, for correlating with CloudWatch logs.
            Present on every MemoryReply (including the RESET_CACHE and
            GENERATE_CSV_OF_QA short-circuits); null only if the runtime did not
            supply one.
          example: "8f1c2e7a-1234-4abc-9def-0123456789ab"

    Command:
      type: string
      description: |
        The action the backend resolved the message to.
        * `NEW` — added a question/answer pair
        * `UPDATE` — changed an existing answer
        * `REMIND` — recalled a stored answer
        * `DELETE` — removed a stored pair
        * `QUIZ` — started a quiz (a question is now posed)
        * `ANSWER` — graded a quiz answer
        * `INSTRUCTIONS` — help / fallback for unclear input
        * `RESET_CACHE` — cleared conversation state (magic literal)
        * `GENERATE_CSV_OF_QA` — emailed a CSV export (magic literal `send_csv`)
        * `ERROR_UNKNOWN_COMMAND` — LLM returned a command outside this
          vocabulary (only on a 502 `llm-unknown-command` problem response)
      enum:
        - NEW
        - UPDATE
        - REMIND
        - DELETE
        - QUIZ
        - ANSWER
        - INSTRUCTIONS
        - RESET_CACHE
        - GENERATE_CSV_OF_QA
        - ERROR_UNKNOWN_COMMAND

    ProblemDetails:
      type: object
      description: |
        RFC 9457 "Problem Details" — the single shape of every non-2xx response
        (media type `application/problem+json`). The standard members are
        `type/title/status/detail/instance`; `request_id`, `reply_to_user`, and
        `command` are extension members (allowed by the spec). Each error is
        defined once in the symbolic registry in `errors.py`; the `type` slug
        and `status` here mirror that registry.
      required: [type, title, status, detail, reply_to_user]
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable URI identifying the problem kind:
            `https://schechter.com/error_codes/<slug>`. The machine key — branch
            on this, not on `detail`. Slugs: `missing-params`,
            `no-email-on-account`, `unauthorized`, `reset-cache-failed`,
            `csv-generation-failed`, `csv-email-failed`, `db-read-failed`,
            `db-write-failed`, `db-delete-failed`, `persist-failed`,
            `quiz-state-corrupt`, `internal-unexpected`, `llm-unknown-command`,
            `llm-call-failed`, `llm-grade-failed`, `embeddings-failed`.
          example: "https://schechter.com/error_codes/db-write-failed"
        title:
          type: string
          description: |
            Stable, developer-facing summary of the problem kind (does not vary
            between occurrences of the same `type`).
          example: "DynamoDB write failed"
        status:
          type: integer
          description: |
            The HTTP status code, duplicated in the body per RFC 9457. One of
            `{400, 401, 500, 502, 503}`.
          example: 500
        detail:
          type: string
          description: |
            Occurrence-specific, developer-facing explanation of this particular
            failure. Not necessarily shown to the user (that is `reply_to_user`).
          example: "put_item threw ClientError updating an existing pair"
        instance:
          type: string
          description: |
            The raise/handle site, auto-captured as `file:func:line`, for
            correlating with CloudWatch logs.
          example: "lambda_function.py:lambda_handler:175"
        reply_to_user:
          type: string
          description: |
            Friendly, plain-text, speakable message to show the user. Always
            present on error responses (extension member).
          example: "Sorry, I couldn't save that change. Please try again."
        command:
          allOf:
            - $ref: '#/components/schemas/Command'
          description: |
            Present when the fault surfaced inside command dispatch — names the
            command being attempted (or `ERROR_UNKNOWN_COMMAND` on a 502).
            Absent for request-level faults (e.g. `missing-params`,
            `unauthorized`).
        request_id:
          type: string
          nullable: true
          description: |
            The AWS Lambda invocation id, for correlating with CloudWatch logs.
            Present on every response (including errors); null only if the
            runtime did not supply one.
          example: "8f1c2e7a-1234-4abc-9def-0123456789ab"
