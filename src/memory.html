<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Memory Sprint</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --navy:      #14296f;  /* "Memory Sprint" title — matches the app */
      --user-blue: #007aff;  /* user message bubbles */
      --bot-gray:  #e9e9eb;  /* assistant message bubbles */
      --bot-text:  #1c1c1e;
      --line:      #d2d2d7;
      --muted:     #6e6e73;
      --field-bg:  #f2f2f7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--bot-text);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* App column */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .app-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    .app-title { font-size: 1.15rem; font-weight: 700; color: var(--navy); }
    .header-actions {
      position: absolute;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--user-blue);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }
    .header-link:hover { text-decoration: underline; }
    .header-link:disabled { opacity: 0.5; cursor: wait; text-decoration: none; }

    /* Sign-in screen */
    .welcome {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 2rem 1.5rem;
    }
    .welcome h1 { font-size: 2rem; font-weight: 700; margin: 0 0 0.5rem; color: var(--navy); }
    .welcome .fields { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 0.75rem; }
    .welcome input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--field-bg);
      font: inherit;
      font-size: 1rem;
    }
    .welcome input:focus { outline: 2px solid var(--user-blue); }
    .btn-primary {
      width: 100%;
      max-width: 340px;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--user-blue);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .welcome .note { min-height: 1.2rem; font-size: 0.9rem; text-align: center; }
    .welcome .note.error { color: #d6322a; }

    /* Conversation */
    .conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 1rem;
      display: none;
      flex-direction: column;
      gap: 0.4rem;
    }
    .empty-hint {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 30ch;
      line-height: 1.5;
    }
    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 78%;
      padding: 0.6rem 0.85rem;
      border-radius: 18px;
      font-size: 1rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg-row.user .bubble {
      background: var(--user-blue);
      color: #fff;
      font-style: italic;
      border-bottom-right-radius: 5px;
    }
    .msg-row.assistant .bubble {
      background: var(--bot-gray);
      color: var(--bot-text);
      border-bottom-left-radius: 5px;
    }
    .bubble.thinking { display: inline-flex; gap: 4px; align-items: center; }
    .bubble.thinking span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: blink 1.3s infinite both;
    }
    .bubble.thinking span:nth-child(2) { animation-delay: 0.2s; }
    .bubble.thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* Composer */
    .composer {
      flex: 0 0 auto;
      display: none;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .composer input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      font: inherit;
      font-size: 1rem;
    }
    .composer input:focus { outline: none; border-color: var(--user-blue); }
    .send-btn {
      flex: 0 0 auto;
      padding: 0 1.3rem;
      border: none;
      border-radius: 20px;
      background: var(--user-blue);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app">
    <div class="app-header">
      <span class="app-title">Memory Sprint</span>
      <div class="header-actions">
        <button class="header-link" id="btn-export">Email my Q&amp;A</button>
        <button class="header-link" id="btn-signout">Sign out</button>
      </div>
    </div>

    <!-- Sign-in screen -->
    <div class="welcome" id="welcome">
      <h1>Welcome</h1>
      <div class="fields">
        <input type="email" id="email" autocomplete="username" placeholder="Email" />
        <input type="password" id="password" autocomplete="current-password" placeholder="Password" />
      </div>
      <button class="btn-primary" id="btn-signin">Sign In</button>
      <p class="note" id="welcome-note"></p>
    </div>

    <!-- Conversation -->
    <div class="conversation" id="conversation">
      <p class="empty-hint" id="empty-hint">Type a message to begin. Tell me what you’d like to remember, or ask me to quiz you.</p>
    </div>

    <!-- Composer -->
    <div class="composer" id="composer">
      <input type="text" id="message" placeholder="Type a message…" autocomplete="off" />
      <button class="send-btn" id="btn-send">Send</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script>
    // ---- Service config (same account as the iOS app) ----
    // Conforms to the Memory Lambda API contract; a replica of the authoritative
    // spec is kept at ../docs/memory-api.openapi.yaml. The client sends one raw
    // utterance in text_from_user and surfaces reply_to_user for every status
    // code (it is a required member on success AND on every RFC 9457 error
    // response), so all documented commands and magic literals (RESET_CACHE,
    // send_csv) work just by sending the text. Re-sync with /sync-memory-api-spec.
    const MEMORY_API   = 'https://fjic2zgsqf.execute-api.us-west-2.amazonaws.com/prod/memory';
    const USER_POOL_ID = 'us-west-2_5CFZClYPo';
    const CLIENT_ID    = '2ai4o11chs71s82op7sjirh2ih';

    const { CognitoUserPool, CognitoUser, AuthenticationDetails } = AmazonCognitoIdentity;
    const userPool = new CognitoUserPool({ UserPoolId: USER_POOL_ID, ClientId: CLIENT_ID });

    let idToken = null;

    const els = {
      header:    document.querySelector('.app-header'),
      export:    document.getElementById('btn-export'),
      signout:   document.getElementById('btn-signout'),
      welcome:   document.getElementById('welcome'),
      email:     document.getElementById('email'),
      password:  document.getElementById('password'),
      signin:    document.getElementById('btn-signin'),
      note:      document.getElementById('welcome-note'),
      conversation: document.getElementById('conversation'),
      emptyHint: document.getElementById('empty-hint'),
      composer:  document.getElementById('composer'),
      message:   document.getElementById('message'),
      send:      document.getElementById('btn-send'),
    };

    // ---- Screen state ----
    function showSignedIn() {
      els.welcome.style.display = 'none';
      els.conversation.style.display = 'flex';
      els.composer.style.display = 'flex';
      els.signout.style.display = 'block';
      els.export.style.display = 'block';
      els.message.focus();
    }

    function showSignedOut(message, isError) {
      idToken = null;
      els.welcome.style.display = 'flex';
      els.conversation.style.display = 'none';
      els.composer.style.display = 'none';
      els.signout.style.display = 'none';
      els.export.style.display = 'none';
      els.signin.disabled = false;
      // clear any prior conversation
      els.conversation.querySelectorAll('.msg-row').forEach((n) => n.remove());
      els.emptyHint.style.display = 'block';
      setNote(message || '', isError);
    }

    function setNote(text, isError) {
      els.note.textContent = text;
      els.note.className = 'note' + (isError ? ' error' : '');
    }

    // ---- Conversation rendering ----
    function addMessage(author, text) {
      els.emptyHint.style.display = 'none';
      const row = document.createElement('div');
      row.className = `msg-row ${author}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      els.conversation.appendChild(row);
      els.conversation.scrollTop = els.conversation.scrollHeight;
      return row;
    }

    function addThinking() {
      els.emptyHint.style.display = 'none';
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.innerHTML = '<div class="bubble thinking"><span></span><span></span><span></span></div>';
      els.conversation.appendChild(row);
      els.conversation.scrollTop = els.conversation.scrollHeight;
      return row;
    }

    // ---- Sign in ----
    function restoreSession() {
      const user = userPool.getCurrentUser();
      if (!user) return;
      user.getSession((err, session) => {
        if (err || !session || !session.isValid()) return;
        idToken = session.getIdToken().getJwtToken();
        showSignedIn();
      });
    }

    function signIn() {
      const email = els.email.value.trim();
      const password = els.password.value;
      if (!email || password.length < 8) {
        setNote('Password must be at least 8 characters.', true);
        return;
      }
      els.signin.disabled = true;
      setNote('Signing in…', false);

      const user = new CognitoUser({ Username: email, Pool: userPool });
      const authDetails = new AuthenticationDetails({ Username: email, Password: password });

      user.authenticateUser(authDetails, {
        onSuccess: (session) => {
          idToken = session.getIdToken().getJwtToken();
          els.password.value = '';
          setNote('', false);
          showSignedIn();
        },
        onFailure: (err) => {
          els.signin.disabled = false;
          const code = err && err.code;
          const msg = (code === 'NotAuthorizedException' || code === 'UserNotFoundException')
            ? 'Incorrect email or password.'
            : (err.message || 'Sign-in failed. Please try again.');
          setNote(msg, true);
        },
        newPasswordRequired: () => {
          els.signin.disabled = false;
          setNote('This account needs a new password. Please set it in the app first.', true);
        },
      });
    }

    function signOut() {
      const user = userPool.getCurrentUser();
      if (user) user.signOut();
      showSignedOut('', false);
    }

    // ---- Send one utterance to the API ----
    // Per the contract, every status code carries reply_to_user (required on
    // success and on every RFC 9457 error); we surface that and treat 401 as an
    // expired session. echoUser=false is used for magic literals (e.g. send_csv)
    // so the literal never shows as a bubble.
    async function postUtterance(text, { echoUser }) {
      if (!idToken) { showSignedOut('Please sign in again.', true); return; }
      if (echoUser) addMessage('user', text);
      els.send.disabled = true;
      els.export.disabled = true;
      const thinking = addThinking();

      try {
        const res = await fetch(MEMORY_API, {
          method: 'POST',
          credentials: 'omit',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
          body: JSON.stringify({ text_from_user: text }),
        });

        let data = null;
        try { data = JSON.parse(await res.text()); } catch {}

        thinking.remove();

        if (res.status === 401) {
          showSignedOut('Your session expired. Please sign in again.', true);
          return;
        }

        const reply = data && data.reply_to_user;
        addMessage('assistant', reply || 'Something went wrong. Please try again.');
      } catch (err) {
        thinking.remove();
        addMessage('assistant', 'Something went wrong. Please check your connection and try again.');
      } finally {
        els.send.disabled = false;
        els.export.disabled = false;
        els.message.focus();
      }
    }

    function send() {
      const text = els.message.value.trim();
      if (!text) return;
      els.message.value = '';
      postUtterance(text, { echoUser: true });
    }

    // Magic literal: emails a CSV of the user's Q&A pairs (GENERATE_CSV_OF_QA).
    function exportCsv() {
      postUtterance('send_csv', { echoUser: false });
    }

    // ---- Wire up ----
    els.signin.addEventListener('click', signIn);
    els.signout.addEventListener('click', signOut);
    els.export.addEventListener('click', exportCsv);
    els.send.addEventListener('click', send);
    els.password.addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
    els.message.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    restoreSession();
  </script>
</body>
</html>
